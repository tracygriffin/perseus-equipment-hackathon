<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sooland Bobcat Dashboard</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Sooland Bobcat &mdash; Dealer Dashboard</h1>
    <span id="subtitle">Loading&hellip;</span>
  </div>
  <div class="filters">
    <label>From
      <input type="date" id="start">
    </label>
    <label>To
      <input type="date" id="end">
    </label>
    <label>Preset
      <select id="preset">
        <option value="">Custom</option>
        <option value="12">Last 12 months</option>
        <option value="24" selected>Last 24 months</option>
        <option value="36">Last 36 months</option>
        <option value="all">All history</option>
      </select>
    </label>
    <button class="primary" id="apply">Apply</button>
    <button class="theme-toggle" id="theme" title="Switch theme" aria-label="Switch between light and dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
    <span id="status"></span>
  </div>
</header>

<nav id="tabs"></nav>

<main id="views"></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
